# Fly.io — un seul service : HTTP statique + WebSocket sur le même port.
# auto_stop coupe la machine quand plus personne ne joue (état en mémoire
# uniquement : une partie en cours ne survit pas à un arrêt, accepté en v1).
app = "bomberman-mael"
primary_region = "cdg"

[env]
  DATA_DIR = "/data"

# Volume persistant pour le classement général (scores.json).
# Créé une fois avec : fly volumes create bomber_data --region cdg --size 1
[mounts]
  source = "bomber_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
